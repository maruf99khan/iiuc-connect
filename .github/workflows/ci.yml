name: CI

on:
  push:
    branches: [main, "sprint-*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Public by design (protected by Row Level Security, not secrecy).
      NEXT_PUBLIC_SUPABASE_URL: https://zhogqnudiosaqihzvkiq.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_BrU3C7MwGYqL4nAIyeHqyw_L8AQCnam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Applies every migration to a throwaway Postgres and runs the pgTAP tests,
  # so a change that weakens Row Level Security fails the build.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db
